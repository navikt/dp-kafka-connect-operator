---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: teamdagpenger
  name: dp-monitor-pods
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - configmaps
    verbs:
      - get
      - watch
      - list
  # Needed for leader election (Lease-based lock between replicas)
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: teamdagpenger
  name: dp-monitor-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dp-monitor-pods
subjects:
  - kind: ServiceAccount
    name: dp-kafka-connect-operator
    namespace: teamdagpenger